name: M04 complete curriculum map
on:
  push:
    paths:
      - 'curriculum/**'
      - 'docs/M04_COVERAGE.md'
      - 'main.py'
      - 'scripts/build_curriculum.py'
      - 'tests/test_m04_curriculum.py'
      - '.github/workflows/m04-curriculum.yml'
      - '[0-1][0-9]_*/**'
  pull_request:
    paths:
      - 'curriculum/**'
      - 'docs/M04_COVERAGE.md'
      - 'main.py'
      - 'scripts/build_curriculum.py'
      - 'tests/test_m04_curriculum.py'
      - '.github/workflows/m04-curriculum.yml'
      - '[0-1][0-9]_*/**'
jobs:
  full-outline-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify all chapters and numbered book TOC items
        run: python3 scripts/build_curriculum.py --check
      - name: Curriculum completeness and drift tests
        run: python3 -m unittest discover -s tests -p 'test_m04_*.py' -v
      - name: Verify scaffold remains unchanged by curriculum tools
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
