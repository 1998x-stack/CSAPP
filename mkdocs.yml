site_name: CSAPP 计算机系统学习地图
site_description: CSAPP 第三版全量章节、知识点与实证审核状态
site_url: https://1998x-stack.github.io/CSAPP/
docs_dir: build/m05-docs
site_dir: build/m05-site
use_directory_urls: true
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - search.highlight
plugins:
  - search
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
nav:
  - 首页: index.md
  - 章节导航:
      - 全部章节: chapters/index.md
      - 第 1 章: chapters/01/index.md
      - 第 2 章: chapters/02/index.md
      - 第 3 章: chapters/03/index.md
      - 第 4 章: chapters/04/index.md
      - 第 5 章: chapters/05/index.md
      - 第 6 章: chapters/06/index.md
      - 第 7 章: chapters/07/index.md
      - 第 8 章: chapters/08/index.md
      - 第 9 章: chapters/09/index.md
      - 第 10 章: chapters/10/index.md
      - 第 11 章: chapters/11/index.md
      - 第 12 章: chapters/12/index.md
  - 附录 A: appendix/index.md
  - 内容进度与审核: progress.md
